[format.rules]
indent-width = 4
line-width = 120
trailing-comment-space-width = 1

[[schemas]]
path = "tombi://www.schemastore.org/pyproject.json"
include = ["pyproject.toml"]

[[schemas.overrides]]
targets = [
    "dependency-groups",
    "dependency-groups.*",
    "project.dependencies",
    "project.optional-dependencies",
    "project.optional-dependencies.*",
    "build-system.requires",
]

[schemas.overrides.format.rules]
array-values-order.enabled = false
table-keys-order.enabled = false

[[schemas]]
path = "https://www.schemastore.org/ruff.json"
include = ["ruff.toml", "ruff.shared.toml"]

[schemas.format.rules]
array-values-order.enabled = false

[project]
name = "placeholder"
description = "${TPROJECT_DESC}"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-placeholder"
authors = [{ name = "Techcable" }]
keywords = ["placeholder", "template"]
classifiers = [
    "Private :: No Classifiers Specified",
]
dependencies = [
    "techcable.orderedset~=0.1",
    "loguru~=0.7.3",
]
dynamic = ["version"]

[project.urls]
Source = "${TPROJECT_REPO_URL}"

[project.optional-dependencies]
pydantic = ["pydantic~=2.0"]
cli = [
    "rich~=15.0",
    "click~=8.0",
]

[dependency-groups]
# mypy is mature and thorough, ty is fast
mypy = ["mypy~=1.0", { include-group = "typing" }]
ty = ["ty", { include-group = "typing" }]
test = [
    "pytest~=9.0",
    "pytest-sugar~=1.0",
]
lint = [
    "tombi~=1.0",
    # pin minor version, since adding new lints triggers failures
    "typos~=1.46.0",
]
# type-only dependencies
typing = [
    "typing_extensions>=4.6",
]
dev = [
    { include-group = "ty" },
    { include-group = "mypy" },
    { include-group = "lint" },
    { include-group = "test" },
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# needed to actually include the sources in the wheel
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.hooks.vcs]
# NOTE: Using a version file avoids some overhead
#
# This file is explicitly ignored by version control.
version-file = "src/placeholder/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.hatch-test]
# use uv instead of venv/pip
installer = "uv"
dependency-groups = ["test"]
extra-dependencies = ["colorama"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14"]
